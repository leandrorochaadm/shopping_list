# Analyses, tests, builds and publishes the PWA to Cloudflare Pages.
#
# Cloudflare's own builder has no Flutter, so the build happens here and only
# the result is uploaded.
#
# TWO ENVIRONMENTS, and the rule this file was written around: **a preview
# NEVER points at `prod`**. `main` builds against the production project;
# every other branch builds a preview against `dev`. The preview URL is
# guessable — `<hash>.<project>.pages.dev` — and an undisclosed URL is the only
# barrier this system has (decision 6), so what sits behind a guessable one has
# to be the disposable database.
#
# THAT RULE IS SUSPENDED TODAY, and on purpose (31/08/2026). There is no `dev`
# project: the Supabase org is at the Free plan's ceiling of two active
# projects, so `SUPABASE_URL_DEV` and `SUPABASE_ANON_KEY_DEV` hold the SAME
# values as the `prod` pair. Every preview therefore writes to `prod` — which
# is acceptable only while `prod` has no real history, and is the same
# conscious divergence from decision 9 that put the nine migrations there.
# NOTHING IN THIS FILE CHANGES when `dev` is born: the two secrets stop
# repeating the production pair, and the rule above is back in force.
#
# The publish step is SKIPPED when the token is empty rather than failing:
# analyse, test and build still run and still guard every push, which is what
# kept this workflow useful while A3 was open.
name: deploy

on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.44.0
  # The skeleton's line was 82.6% and the suite is well above it today. The
  # floor sits below the current number on purpose — enough room for a feature
  # to land with its tests one commit behind, not enough for a screen to
  # arrive untested. An item on a checklist that nothing measures is an
  # intention, not a gate.
  MIN_COVERAGE: '90.0'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Before the tests, and not after: this is what catches an import of
      # `package:flutter/…` inside `domain/`, which no test would notice.
      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test --coverage

      - name: coverage floor
        run: |
          set -euo pipefail
          total=$(awk -F: '
            /^LF:/ { found += $2 }
            /^LH:/ { hit += $2 }
            END { if (found == 0) { print "0"; exit } printf "%.1f", 100 * hit / found }
          ' coverage/lcov.info)
          echo "line coverage: ${total}% (floor ${MIN_COVERAGE}%)"
          awk -v total="$total" -v floor="$MIN_COVERAGE" 'BEGIN { exit !(total + 0 >= floor + 0) }' \
            || { echo "::error::coverage ${total}% is below the ${MIN_COVERAGE}% floor"; exit 1; }

      # `main` talks to prod; everything else talks to dev — which today is
      # the same project, see the note at the top of this file. Empty secrets
      # produce a build that shows MisconfiguredApp instead of a white screen —
      # which is the honest outcome, and is why that screen exists.
      - name: pick the environment
        id: environment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
        run: |
          set -euo pipefail
          # WHETHER TO PUBLISH IS DECIDED HERE, and travels as an output, for a
          # reason that cost this workflow two green runs that proved nothing:
          # a step's own `env:` is NOT visible to that step's `if:`. The
          # condition is evaluated before the step is set up, so `env.TOKEN`
          # reads empty there no matter what the secret holds — the publish
          # step would never run, and the "nothing was published" step would
          # always run. A script CAN read its own env, so the question is
          # answered where the answer exists.
          if [ -n "${CLOUDFLARE_API_TOKEN}" ] && [ -n "${CLOUDFLARE_PROJECT_NAME}" ]; then
            echo "publish=yes" >> "$GITHUB_OUTPUT"
          else
            echo "publish=no" >> "$GITHUB_OUTPUT"
          fi
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "url=${{ secrets.SUPABASE_URL_PROD }}" >> "$GITHUB_OUTPUT"
            echo "key=${{ secrets.SUPABASE_ANON_KEY_PROD }}" >> "$GITHUB_OUTPUT"
            echo "branch=main" >> "$GITHUB_OUTPUT"
            echo "target: prod"
          else
            echo "url=${{ secrets.SUPABASE_URL_DEV }}" >> "$GITHUB_OUTPUT"
            echo "key=${{ secrets.SUPABASE_ANON_KEY_DEV }}" >> "$GITHUB_OUTPUT"
            echo "branch=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "target: dev (preview)"
          fi

      # The three numbers the `≡` footer shows. They are NOT read from the
      # pubspec at runtime: web cannot read it, and a package that could is
      # outside the frozen dependency list (tecnico §3).
      #
      # The build number is `github.run_number` — the workflow's own run
      # counter, which grows on every run. The alternative, bumping `+N` in the
      # pubspec and pushing the commit back, would need a write token, a
      # `[skip ci]` guard against the workflow triggering itself, and would
      # still race with a push made while the run is in flight.
      - name: app version
        id: version
        run: |
          set -euo pipefail
          name=$(sed -n 's/^version:[[:space:]]*\([0-9.]*\).*/\1/p' pubspec.yaml)
          if [ -z "$name" ]; then
            echo "::error::no version: line in pubspec.yaml"; exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "build=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "commit=$(echo "${{ github.sha }}" | cut -c1-7)" >> "$GITHUB_OUTPUT"
          echo "publishing $name+${{ github.run_number }}"

      - name: flutter build web
        # `--build-number` does not feed the label — nothing on web reads the
        # pubspec at runtime, which is why the defines exist. It is here because
        # `flutter build web` writes `build/web/version.json` from the pubspec,
        # and without it that file would publish `1` forever: a second number,
        # visible at the origin, contradicting what the `≡` shows.
        run: |
          flutter build web --release \
            --dart-define=SUPABASE_URL='${{ steps.environment.outputs.url }}' \
            --dart-define=SUPABASE_ANON_KEY='${{ steps.environment.outputs.key }}' \
            --dart-define=APP_VERSION='${{ steps.version.outputs.name }}' \
            --dart-define=APP_BUILD_NUMBER='${{ steps.version.outputs.build }}' \
            --dart-define=APP_COMMIT='${{ steps.version.outputs.commit }}' \
            --build-number='${{ steps.version.outputs.build }}'

      - name: publish to Cloudflare Pages
        # Skipped, not failed, when the credentials are absent.
        if: steps.environment.outputs.publish == 'yes'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # The undisclosed subdomain of A3. A repository VARIABLE and not a
          # secret: it is the project name wrangler needs, and hiding it from
          # the log would not hide it from whoever opens the app.
          CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
        run: |
          npx --yes wrangler@3 pages deploy build/web \
            --project-name "$CLOUDFLARE_PROJECT_NAME" \
            --branch "${{ steps.environment.outputs.branch }}" \
            --commit-dirty=true

      - name: say why nothing was published
        if: steps.environment.outputs.publish == 'no'
        run: |
          echo "::notice::Build ok, nothing published: the Cloudflare credentials are missing."
          echo "Needed: secrets CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,"
          echo "SUPABASE_URL_DEV, SUPABASE_ANON_KEY_DEV, SUPABASE_URL_PROD,"
          echo "SUPABASE_ANON_KEY_PROD; and the repository variable"
          echo "CLOUDFLARE_PROJECT_NAME."
