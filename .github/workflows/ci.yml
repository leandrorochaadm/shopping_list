name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Keep in sync with release.yml and the PocketBase on the VPS.
env:
  FLUTTER_VERSION: 3.44.0
  POCKETBASE_VERSION: 0.40.5
  # Below the current number on purpose: room for a feature to land with its
  # tests one commit behind, not for a screen to arrive untested.
  # .githooks/pre-push reads it from here.
  MIN_COVERAGE: '90.0'

jobs:
  flutter:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --coverage
      - name: Coverage floor
        run: |
          set -euo pipefail
          total=$(awk -F: '
            /^LF:/ { found += $2 }
            /^LH:/ { hit += $2 }
            END { if (found == 0) { print "0"; exit } printf "%.1f", 100 * hit / found }
          ' coverage/lcov.info)
          echo "line coverage: ${total}% (floor ${MIN_COVERAGE}%)"
          awk -v total="$total" -v floor="$MIN_COVERAGE" 'BEGIN { exit !(total + 0 >= floor + 0) }' \
            || { echo "::error::coverage ${total}% is below the ${MIN_COVERAGE}% floor"; exit 1; }
      - run: flutter build web --dart-define-from-file=config/dev.json.example

  pocketbase:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Download PocketBase
        run: |
          set -euo pipefail
          zip="pocketbase_${POCKETBASE_VERSION}_linux_amd64.zip"
          base="https://github.com/pocketbase/pocketbase/releases/download/v${POCKETBASE_VERSION}"
          dir="$RUNNER_TEMP/pocketbase-download"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/$zip" "$base/$zip"
          curl -fsSL --retry 3 -o "$dir/checksums.txt" "$base/checksums.txt"
          (cd "$dir" && grep " ${zip}$" checksums.txt | sha256sum -c -)
          unzip -o "$dir/$zip" pocketbase -d pocketbase/
          ./pocketbase/pocketbase --version | grep -F "$POCKETBASE_VERSION"
      - name: Check migrations on an empty database
        run: ./pocketbase/pocketbase migrate up --dir="$RUNNER_TEMP/pb_data" --migrationsDir=pocketbase/pb_migrations
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - name: Test tool scripts
        run: uv run --with pytest --with httpx pytest tool/
